version: '3.8'

services:
  grafana:
    image: grafana/grafana-enterprise
    container_name: smart-grafana
    # Use host network mode to easily access InfluxDB on localhost:8086
    network_mode: "host"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=Nontawat01
      # Enable Anonymous Admin for auto-login (Frontend acts as Auth Gatekeeper)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      # Change port to 3002 to avoid conflict with React (3000) and API (3001) if they overlap
      - GF_SERVER_HTTP_PORT=3002
      # Install useful plugins for energy monitoring
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      # Persistent storage for dashboards and users
      - ./grafana-storage:/var/lib/grafana
      # Auto-provisioning for Datasources
      - ./grafana/provisioning:/etc/grafana/provisioning
    restart: unless-stopped
